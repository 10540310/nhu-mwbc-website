<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>活動照片管理｜南華大學中智佛學社</title>


    <!-- Favicon -->

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="../assets/logo2.png"
    >

    <link
        rel="apple-touch-icon"
        href="../assets/logo2.png"
    >


    <!-- 字體 -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- 後台共用 CSS -->

    <link
        rel="stylesheet"
        href="admin.css"
    >


    <style>

        .photo-section {

            background: white;

            padding: 25px;

            border-radius: 14px;

            margin-bottom: 30px;

        }


        .photo-section-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 20px;

        }


        .photo-section-header h2 {

            color: #8a6b12;

            margin: 0;

        }


        .photo-count {

            color: #666;

            font-size: 14px;

        }


        .upload-box {

            background: #f7f4ee;

            padding: 20px;

            border-radius: 12px;

            margin-bottom: 25px;

        }


        .upload-box h3 {

            margin-bottom: 15px;

            color: #8a6b12;

        }


        .upload-row {

            display: flex;

            align-items: center;

            gap: 12px;

            flex-wrap: wrap;

        }


        .upload-row input[type="file"] {

            flex: 1;

            min-width: 220px;

            background: white;

            padding: 10px;

            border: 1px solid #ddd;

            border-radius: 8px;

        }


        .upload-button {

            border: none;

            background: #8a6b12;

            color: white;

            padding: 11px 20px;

            border-radius: 8px;

            cursor: pointer;

            font-family: inherit;

        }


        .upload-button:hover {

            background: #c49b32;

        }


        .upload-button:disabled {

            opacity: 0.55;

            cursor: not-allowed;

        }


        .photo-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(220px, 1fr)
                );

            gap: 20px;

        }


        .photo-card {

            border: 1px solid #e3dfd6;

            border-radius: 12px;

            overflow: hidden;

            background: #fff;

        }


        .photo-preview {

            width: 100%;

            height: 180px;

            object-fit: cover;

            display: block;

            background: #eee;

        }


        .photo-info {

            padding: 15px;

        }


        .photo-name {

            font-size: 14px;

            word-break: break-all;

            margin-bottom: 12px;

            color: #444;

        }


        .photo-position {

            font-size: 13px;

            color: #777;

            margin-bottom: 12px;

        }


        .photo-actions {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 8px;

        }


        .photo-actions button {

            border: none;

            padding: 9px 8px;

            border-radius: 7px;

            cursor: pointer;

            font-family: inherit;

        }


        .move-button {

            background: #eee9dc;

            color: #654e0c;

        }


        .move-button:hover {

            background: #dfd5b8;

        }


        .move-button:disabled {

            opacity: 0.4;

            cursor: not-allowed;

        }


        .delete-button {

            grid-column: 1 / -1;

            background: #a33;

            color: white;

        }


        .delete-button:hover {

            background: #822;

        }


        .delete-button:disabled {

            opacity: 0.5;

            cursor: not-allowed;

        }


        .status-message {

            display: none;

            padding: 14px 18px;

            border-radius: 9px;

            margin-bottom: 25px;

            line-height: 1.7;

        }


        .status-message.show {

            display: block;

        }


        .status-message.success {

            background: #e8f5e9;

            color: #27632b;

        }


        .status-message.error {

            background: #fdeaea;

            color: #8b2525;

        }


        .status-message.info {

            background: #fff6db;

            color: #705713;

        }


        .loading-text {

            grid-column: 1 / -1;

            text-align: center;

            padding: 30px;

            color: #777;

        }


        .empty-text {

            grid-column: 1 / -1;

            text-align: center;

            padding: 30px;

            background: #f7f4ee;

            border-radius: 10px;

            color: #777;

        }


        @media (max-width: 768px) {

            .photo-section-header {

                align-items: flex-start;

                flex-direction: column;

                gap: 5px;

            }


            .photo-grid {

                grid-template-columns: 1fr;

            }


            .photo-preview {

                height: 220px;

            }

        }

    </style>

</head>


<body>


    <!-- ============================= -->
    <!-- 側邊欄 -->
    <!-- ============================= -->

    <aside class="sidebar">

        <h2>
            中智佛學社
        </h2>


        <ul>

            <li>

                <a href="admin.html">
                    儀表板
                </a>

            </li>


            <li>

                <a href="news.html">
                    最新消息
                </a>

            </li>


            <li>

                <a href="course.html">
                    社課管理
                </a>

            </li>


            <li>

                <a href="faq.html">
                    Q&A 管理
                </a>

            </li>


            <li class="active">

                <a href="activity.html">
                    活動照片
                </a>

            </li>


            <li>

                <a href="settings.html">
                    網站設定
                </a>

            </li>


            <li id="logoutBtn">
                登出
            </li>

        </ul>

    </aside>



    <!-- ============================= -->
    <!-- 主內容 -->
    <!-- ============================= -->

    <main class="main">


        <header>

            <h1>
                活動照片管理
            </h1>

        </header>


        <div
            id="statusMessage"
            class="status-message"
        ></div>



        <!-- ========================= -->
        <!-- 活動精選 -->
        <!-- ========================= -->

        <section class="photo-section">


            <div class="photo-section-header">

                <h2>
                    📸 活動精選
                </h2>

                <span
                    id="featuredCount"
                    class="photo-count"
                >
                    0 張
                </span>

            </div>



            <div class="upload-box">

                <h3>
                    新增活動精選照片
                </h3>


                <div class="upload-row">

                    <input
                        type="file"
                        id="featuredFile"
                        accept="image/jpeg,image/png,image/webp"
                    >


                    <button
                        type="button"
                        id="uploadFeaturedBtn"
                        class="upload-button"
                    >
                        上傳照片
                    </button>

                </div>

            </div>



            <div
                id="featuredList"
                class="photo-grid"
            >

                <p class="loading-text">
                    活動精選載入中...
                </p>

            </div>


        </section>



        <!-- ========================= -->
        <!-- 活動照片 -->
        <!-- ========================= -->

        <section class="photo-section">


            <div class="photo-section-header">

                <h2>
                    🖼️ 活動照片
                </h2>

                <span
                    id="galleryCount"
                    class="photo-count"
                >
                    0 張
                </span>

            </div>



            <div class="upload-box">

                <h3>
                    新增活動照片
                </h3>


                <div class="upload-row">

                    <input
                        type="file"
                        id="galleryFile"
                        accept="image/jpeg,image/png,image/webp"
                    >


                    <button
                        type="button"
                        id="uploadGalleryBtn"
                        class="upload-button"
                    >
                        上傳照片
                    </button>

                </div>

            </div>



            <div
                id="galleryList"
                class="photo-grid"
            >

                <p class="loading-text">
                    活動照片載入中...
                </p>

            </div>


        </section>


    </main>



    <!-- ============================= -->
    <!-- JavaScript -->
    <!-- ============================= -->

    <script
        type="module"
        src="activity.js?v=1"
    ></script>


</body>
