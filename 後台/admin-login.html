<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        後台登入｜南華大學中智佛學社
    </title>

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="../assets/logo2.png">

    <link
        rel="apple-touch-icon"
        href="../assets/logo2.png">

    <link
        rel="stylesheet"
        href="admin-login.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap"
        rel="stylesheet">

</head>

<body>


    <!-- ========================================
         登入區塊
    ========================================= -->

    <div class="login-container">

        <div class="login-box">


            <!-- 社團 Logo -->

            <img
                src="../assets/logo.png"
                alt="中智佛學社社徽">


            <h1>
                中智佛學社
            </h1>

            <h2>
                網站管理後台
            </h2>


            <!-- ========================================
                 登入表單
            ========================================= -->

            <form id="loginForm">


                <!-- Email -->

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        autocomplete="username"
                        required>

                </div>


                <!-- 密碼 -->

                <div class="input-group">

                    <label for="password">
                        密碼
                    </label>

                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        required>

                </div>


                <!-- 登入按鈕 -->

                <button
                    type="submit"
                    id="loginButton">

                    登入

                </button>


                <!-- 錯誤訊息 -->

                <p id="errorMessage"></p>


            </form>

        </div>

    </div>



    <!-- ========================================
         Firebase Authentication
    ========================================= -->

    <script type="module">


        /* ========================================
           Firebase App
        ======================================== */

        import {
            initializeApp
        }
        from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


        /* ========================================
           Firebase Authentication
        ======================================== */

        import {

            getAuth,

            setPersistence,

            browserSessionPersistence,

            signInWithEmailAndPassword,

            onAuthStateChanged

        }
        from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";



        /* ========================================
           Firebase 設定
        ======================================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyDk8-Q0gQEW-g6RYrSJgDeqwMwUEM9Khig",

            authDomain:
                "nhumwbc.firebaseapp.com",

            projectId:
                "nhumwbc",

            storageBucket:
                "nhumwbc.firebasestorage.app",

            messagingSenderId:
                "191508777501",

            appId:
                "1:191508777501:web:af7b9a43542654921954f4",

            measurementId:
                "G-EE2J8CPS0H"

        };



        /* ========================================
           初始化 Firebase
        ======================================== */

        const app =
            initializeApp(
                firebaseConfig
            );


        const auth =
            getAuth(app);



        /* ========================================
           DOM
        ======================================== */

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const emailInput =
            document.getElementById(
                "email"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const loginButton =
            document.getElementById(
                "loginButton"
            );


        const errorMessage =
            document.getElementById(
                "errorMessage"
            );



        /* ========================================
           登入狀態檢查

           browserSessionPersistence 的登入資料
           只存在目前瀏覽器分頁工作階段。

           關閉分頁後：
           → 登入狀態消失

           關閉瀏覽器後：
           → 登入狀態消失

           重新整理：
           → 保持登入
        ======================================== */

        onAuthStateChanged(
            auth,
            (user) => {

                if(user){

                    window.location.replace(
                        "admin.html"
                    );

                }

            }
        );



        /* ========================================
           登入
        ======================================== */

        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                /* 清除舊錯誤訊息 */

                errorMessage.textContent =
                    "";


                /* 取得輸入資料 */

                const email =
                    emailInput.value.trim();


                const password =
                    passwordInput.value;


                /* 防止重複點擊 */

                loginButton.disabled =
                    true;


                loginButton.textContent =
                    "登入中...";


                try{


                    /* ========================================
                       關鍵設定

                       使用 Session Persistence。

                       不再永久儲存 Firebase 登入狀態。
                    ======================================== */

                    await setPersistence(
                        auth,
                        browserSessionPersistence
                    );



                    /* ========================================
                       Firebase 登入
                    ======================================== */

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );



                    /* ========================================
                       登入成功
                    ======================================== */

                    window.location.replace(
                        "admin.html"
                    );


                }
                catch(error){


                    console.error(
                        "登入失敗：",
                        error
                    );


                    /* ========================================
                       中文錯誤訊息
                    ======================================== */

                    switch(error.code){


                        case "auth/invalid-email":

                            errorMessage.textContent =
                                "Email 格式不正確";

                            break;


                        case "auth/invalid-credential":

                            errorMessage.textContent =
                                "Email 或密碼錯誤";

                            break;


                        case "auth/user-disabled":

                            errorMessage.textContent =
                                "此帳號已被停用";

                            break;


                        case "auth/too-many-requests":

                            errorMessage.textContent =
                                "登入嘗試次數過多，請稍後再試";

                            break;


                        case "auth/network-request-failed":

                            errorMessage.textContent =
                                "網路連線失敗，請檢查網路後再試";

                            break;


                        default:

                            errorMessage.textContent =
                                "登入失敗，請確認帳號密碼";

                            break;

                    }


                    /* 恢復登入按鈕 */

                    loginButton.disabled =
                        false;


                    loginButton.textContent =
                        "登入";

                }

            }
        );


    </script>


</body>

</html>
